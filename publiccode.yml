description:
  en:
    shortDescription: 'Image-analysis pipeline for fluorescence images of melanoma-fibroblast co-spheroids: morphometry, radial profiles and core-shell metrics.'
    longDescription: |
      A command-line Python pipeline that turns two-channel fluorescence images of heterotypic melanoma-fibroblast spheroids into quantitative descriptors of spheroid shape and of the spatial arrangement of the two cell populations.

      For each spheroid, the GFP (melanoma) and PKH26 (fibroblast) widefield images are paired by filename and the spheroid is segmented. The pipeline then computes morphometric descriptors, radial intensity profiles of both channels over 20 concentric rings and core-shell metrics of their relative radial position. Further scripts analyse confocal z-stacks, convert Leica .lif files to OME-TIFF and run image-quality and segmentation-robustness checks.

      The code reproduces the processed data of the dataset described in a Scientific Data Data Descriptor and deposited in the BioImage Archive (accession S-BIAD4346, https://doi.org/10.6019/S-BIAD4346). It runs on Linux, macOS and Windows with Python 3 and standard scientific libraries (NumPy, pandas, scikit-image, OpenCV).
    documentation: https://github.com/consiglionazionaledellericerche/lanzafame-lab-melanoma-fibroblast-spheroids/blob/main/docs/pipeline_overview.md
    features:
    - Pairing of the GFP and PKH26 images of each spheroid by filename
    - Spheroid segmentation and morphometric descriptors in pixels and micrometres
    - Radial intensity profiles of both cell populations over 20 concentric rings
    - Core-shell metrics of the relative radial position of the two populations
    - Confocal z-stack analysis and lossless conversion of Leica .lif files to OME-TIFF
    - Image-quality and segmentation-robustness checks
  it:
    shortDescription: 'Pipeline di analisi di immagini di fluorescenza di co-sferoidi di melanoma e fibroblasti: morfometria, profili radiali e metriche core-shell.'
    longDescription: |
      Pipeline Python a riga di comando che trasforma immagini di fluorescenza a due canali di sferoidi eterotipici di melanoma e fibroblasti in descrittori quantitativi della forma dello sferoide e della disposizione spaziale delle due popolazioni cellulari.

      Per ogni sferoide, le immagini widefield GFP (melanoma) e PKH26 (fibroblasti) vengono appaiate in base al nome del file e lo sferoide viene segmentato. La pipeline calcola poi descrittori morfometrici, profili radiali di intensità dei due canali su 20 anelli concentrici e metriche core-shell della loro posizione radiale relativa. Altri script analizzano gli z-stack confocali, convertono i file Leica .lif in OME-TIFF ed eseguono controlli di qualità delle immagini e di robustezza della segmentazione.

      Il codice riproduce i dati processati del dataset descritto in un Data Descriptor di Scientific Data e depositato nel BioImage Archive (accession S-BIAD4346, https://doi.org/10.6019/S-BIAD4346). Funziona su Linux, macOS e Windows con Python 3 e librerie scientifiche standard (NumPy, pandas, scikit-image, OpenCV).
    documentation: https://github.com/consiglionazionaledellericerche/lanzafame-lab-melanoma-fibroblast-spheroids/blob/main/docs/pipeline_overview.md
    features:
    - Appaiamento delle immagini GFP e PKH26 di ogni sferoide in base al nome del file
    - Segmentazione dello sferoide e descrittori morfometrici in pixel e micrometri
    - Profili radiali di intensità delle due popolazioni cellulari su 20 anelli concentrici
    - Metriche core-shell della posizione radiale relativa delle due popolazioni
    - Analisi degli z-stack confocali e conversione senza perdita dei file Leica .lif in OME-TIFF
    - Controlli di qualità delle immagini e di robustezza della segmentazione
